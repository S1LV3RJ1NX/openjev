[project]
name = "openjev"
version = "0.0.1"
description = "Open System One models: typed decisions with calibrated probabilities, no text generation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["classification", "calibration", "encoder", "routing", "typed-decisions"]
dependencies = []

[project.optional-dependencies]
data = ["pandas>=2.0", "pyarrow>=15.0", "datasets>=2.0"]
train = ["torch>=2.5", "transformers>=4.48", "numpy>=1.26"]

[project.urls]
Repository = "https://github.com/OWNER/openjev"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openjev"]
